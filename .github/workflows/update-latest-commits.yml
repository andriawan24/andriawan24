name: Update latest commits

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-commits
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_README_TOKEN: ${{ secrets.PROFILE_README_TOKEN }}
          PROFILE_README_TOKEN_2: ${{ secrets.PROFILE_README_TOKEN_2 }}
          PROFILE_README_TOKEN_3: ${{ secrets.PROFILE_README_TOKEN_3 }}
        run: node scripts/update-latest-commits.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update latest commits"
          git push
